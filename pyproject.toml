[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cement-opt"
version = "0.1.0"
description = "Machine learning and NSGA-II multi-objective optimization framework for sustainable cement kiln production."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Amusat Haki Adeyemi" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "pymoo>=0.6.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "nbformat>=5.9.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
cement-opt = "cement_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cement_opt = ["visualization/templates/*.html", "visualization/templates/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
